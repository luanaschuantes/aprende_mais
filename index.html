<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Mais — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <h1>Aprende Mais</h1>
                <p class="tagline">Biologia • Química • Física • Matemática</p>
            </div>
            <form id="formLogin">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required autocomplete="username">
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo 4 caracteres" required autocomplete="current-password">
                </div>
                <p id="erroLogin" class="erro" style="display:none;">Use um e-mail e senha com pelo menos 4 caracteres.</p>
                <button type="submit" class="btn-primario">Entrar</button>
            </form>
            <p class="dica-login">Demo: qualquer e-mail e senha com 4+ caracteres</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
